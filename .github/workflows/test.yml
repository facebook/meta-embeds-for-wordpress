name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }}, WP ${{ matrix.wp-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Allow trunk (WP 7.0) failures without blocking CI.
    continue-on-error: ${{ matrix.wp-version == 'trunk' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.4'
            wp-version: '5.9'
          - php-version: '8.0'
            wp-version: '6.3'
          - php-version: '8.1'
            wp-version: '6.5'
          - php-version: '8.2'
            wp-version: '6.7'
          - php-version: '8.3'
            wp-version: '6.9'
          - php-version: '8.3'
            wp-version: 'latest'
          - php-version: '8.3'
            wp-version: 'trunk'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }} true

      - name: Run PHPUnit
        run: vendor/bin/phpunit
